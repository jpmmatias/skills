<!doctype html>
<!-- Spaced review for the example course.
     It loads every lesson's practice file (course.js lessons[].practice, or lessons/NNNN.practice.js) and asks
     2–3 items per due objective, mixed together, with no lesson text. Each finished objective is recorded as a
     review session, which is the only thing that moves it between review boxes (1, 3, 7, 14, 30 days). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
<title>Review · How Transformers Work</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<main>
  <nav class="links" aria-label="Course"><a href="index.html">← Course map</a></nav>
  <p class="kicker">Review</p>
  <h1>Answer from memory</h1>
  <p class="lede">A few questions from earlier lessons. Spacing them out is what makes them last.</p>
  <div data-review></div>
</main>
<script src="assets/core.js"></script>
<script src="assets/store.js"></script>
<script src="assets/course.js"></script>
<script src="assets/progress.js"></script>
<script src="assets/practice.js"></script>
</body>
</html>
